name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:development
      - run: npm run build
      - run: npm run test:deployment
      - run: npm run test:publication
      # Live Auth/RLS tests require a separately provisioned isolated stack.
      # No scheduled collection, database mutation or deployment runs in CI.
