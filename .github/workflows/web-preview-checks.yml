name: Web preview checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-preview-checks.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-preview-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:deployment
      # This workflow never connects to Supabase, migrates a DB or deploys a site.
